<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TaskTracker Pro // Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background: #f4f5f7; 
            color: #172b4d; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        .modal { display: none; }
        
        .priority-high { background: #ffebe6; color: #de350b; border: 1px solid #ffbdad; }
        .priority-medium { background: #fffae6; color: #b68d00; border: 1px solid #fff0b3; }
        .priority-low { background: #e3fcef; color: #006644; border: 1px solid #abf5d1; }
        
        .techy-delete { 
            background: #ffffff;
            color: #42526e;
            border: 1px solid #dfe1e6;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 3px;
            transition: all 0.15s ease-in-out;
        }
        .techy-delete:hover { 
            background: #de350b; 
            color: #ffffff; 
            border-color: #de350b;
        }

        .task-card { 
            background: #ffffff; 
            border: 1px solid #dfe1e6; 
            box-shadow: 0 1px 2px 0 rgba(9, 30, 66, 0.25); 
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .task-card:hover { 
            border-color: #4c9aff; 
            box-shadow: 0 4px 8px -2px rgba(9, 30, 66, 0.25); 
        }

        .jira-search {
            font-size: 13px;
            background: #fafbfc;
            border: 2px solid #dfe1e6;
            color: #172b4d;
            transition: all 0.15s ease-in-out;
        }
        .jira-search:focus {
            background: #ffffff;
            border-color: #0052cc;
            outline: none;
        }
    </style>
</head>
<body class="p-8">
<div class="max-w-7xl mx-auto bg-white rounded-lg border border-[#dfe1e6] p-6 shadow-sm">
    
    <!-- Control Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-gray-200 pb-5 mb-6">
        <div>
            <h1 class="text-xl font-bold tracking-tight text-[#172b4d]">TaskTracker <span class="text-blue-600 font-extrabold">// Board</span></h1>
            <p class="text-xs text-slate-500 font-semibold mt-0.5">Workflow: Forward Movement Restriction Enabled</p>
        </div>
        
        <div class="flex items-center gap-3">
            <input type="text" id="searchBar" onkeyup="render()" placeholder="Filter tasks..." class="jira-search px-3 py-1.5 w-48 rounded font-medium">
            <button onclick="openForm()" class="bg-[#0052cc] hover:bg-[#0065ff] text-white text-xs font-bold px-4 py-2 rounded transition shadow-sm">
                Create task
            </button>
        </div>
    </div>

    <!-- Kanban Columns Grid with explicit separation gap-6 -->
    <div class="grid md:grid-cols-3 gap-6">
        <!-- To Do Lane -->
        <div class="bg-[#f4f5f7] rounded-lg p-4 border border-gray-200/80 min-h-[550px]" ondrop="drop(event, 'ToDo')" ondragover="allowDrop(event)">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#5e6c84] mb-4">To Do</h2>
            <div id="ToDo" class="space-y-3"></div>
        </div>
        <!-- In Progress Lane -->
        <div class="bg-[#f4f5f7] rounded-lg p-4 border border-gray-200/80 min-h-[550px]" ondrop="drop(event, 'InProgress')" ondragover="allowDrop(event)">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#0052cc] mb-4">In Progress</h2>
            <div id="InProgress" class="space-y-3"></div>
        </div>
        <!-- Done Lane -->
        <div class="bg-[#f4f5f7] rounded-lg p-4 border border-gray-200/80 min-h-[550px]" ondrop="drop(event, 'Done')" ondragover="allowDrop(event)">
            <h2 class="text-xs font-bold uppercase tracking-wider text-[#006644] mb-4">Done</h2>
            <div id="Done" class="space-y-3"></div>
        </div>
    </div>
</div>

<!-- Modal Entry Frame -->
<div id="taskModal" class="modal fixed inset-0 bg-[#091e42]/40 backdrop-blur-sm flex justify-center items-center z-50">
    <div class="bg-white border border-[#dfe1e6] rounded-lg p-6 w-full max-w-md shadow-xl">
        <h2 class="text-lg font-bold text-[#172b4d] tracking-tight mb-4">Create Task</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-[#5e6c84] mb-1">Summary *</label>
                <input id="title" type="text" class="w-full bg-[#fafbfc] border-2 border-[#dfe1e6] p-2 text-sm rounded text-[#172b4d] outline-none focus:border-[#0052cc] focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-[#5e6c84] mb-1">Assignee</label>
                <input id="assignee" type="text" placeholder="e.g. John Doe" class="w-full bg-[#fafbfc] border-2 border-[#dfe1e6] p-2 text-sm rounded text-[#172b4d] outline-none focus:border-[#0052cc] focus:bg-white transition">
            </div>
            <div>
                <label class="block text-xs font-bold text-[#5e6c84] mb-1">Priority</label>
                <select id="priority" class="w-full bg-[#fafbfc] border-2 border-[#dfe1e6] p-2 text-sm rounded text-[#172b4d] outline-none focus:border-[#0052cc] focus:bg-white transition">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-[#5e6c84] mb-1">Description</label>
                <textarea id="description" rows="3" class="w-full bg-[#fafbfc] border-2 border-[#dfe1e6] p-2 text-sm rounded text-[#172b4d] outline-none focus:border-[#0052cc] focus:bg-white transition"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeForm()" class="px-4 py-2 text-xs font-bold text-[#42526e] hover:bg-gray-100 rounded">Cancel</button>
                <button onclick="saveTask()" class="px-4 py-2 text-xs font-bold bg-[#0052cc] hover:bg-[#0065ff] text-white rounded">Create</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000/api/tasks";
let allTasks = [];

function allowDrop(ev) { ev.preventDefault(); }
function drag(ev, id) { ev.dataTransfer.setData("taskId", id); }

async function drop(ev, newStatus) {
    ev.preventDefault();
    const taskId = ev.dataTransfer.getData("taskId");
    const task = allTasks.find(t => t.id == taskId);
    
    if (task.status === "InProgress" && newStatus === "ToDo") { 
        alert("Workflow Error: Moving cards backwards from In Progress to To Do is not permitted."); 
        return; 
    }
    
    await fetch(`${API_BASE}/${taskId}/status`, { 
        method: "PATCH", 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify({ status: newStatus }) 
    });
    render();
}

async function render() {
    const res = await fetch(`${API_BASE}/`);
    allTasks = await res.json();
    const query = document.getElementById("searchBar").value.toLowerCase().trim();
    
    document.querySelectorAll('#ToDo, #InProgress, #Done').forEach(el => el.innerHTML = "");

    allTasks.filter(t => t.title.toLowerCase().includes(query)).forEach(task => {
        const priority = task.priority || "Medium";
        const badgeClass = `priority-${priority.toLowerCase()}`;
        const assigneeText = task.assignee ? task.assignee.trim() : "Unassigned";
        
        // Compute short letters for avatar badge representation
        const avatarInitials = assigneeText !== "Unassigned" 
            ? assigneeText.split(" ").map(n => n[0]).join("").toUpperCase().substring(0,2) 
            : "??";

        document.getElementById(task.status).innerHTML += `
            <div draggable="true" ondragstart="drag(event, ${task.id})" class="task-card p-4 rounded cursor-grab active:cursor-grabbing transition-all">
                <h3 class="font-bold text-[14px] text-[#172b4d] tracking-tight leading-snug">${task.title}</h3>
                <p class="text-[#5e6c84] text-xs mt-1.5 font-normal">${task.description || ""}</p>
                
                <!-- Assignee Label Layout Row -->
                <div class="flex items-center gap-2 mt-3 bg-slate-50 p-1.5 rounded border border-gray-100">
                    <div class="w-5 h-5 rounded-full bg-blue-100 border border-blue-300 text-[9px] font-bold text-blue-700 flex items-center justify-center shrink-0">
                        ${avatarInitials}
                    </div>
                    <span class="text-[11px] font-semibold text-[#42526e] truncate">Assignee: ${assigneeText}</span>
                </div>

                <div class="flex justify-between items-center mt-4 pt-2 border-t border-gray-100">
                    <span class="${badgeClass} px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">${priority}</span>
                    <button onclick="deleteTask(${task.id})" class="techy-delete">Delete</button>
                </div>
            </div>`;
    });
}

function openForm() { document.getElementById("taskModal").style.display = "flex"; }
function closeForm() { 
    document.getElementById("taskModal").style.display = "none";
    document.getElementById("title").value = "";
    document.getElementById("assignee").value = "";
    document.getElementById("description").value = "";
    document.getElementById("priority").value = "Medium";
}

async function saveTask() {
    const title = document.getElementById("title").value.trim();
    if (!title) return alert("Validation Error: The Summary field is required.");
    
    const priority = document.getElementById("priority").value; 
    const description = document.getElementById("description").value;
    const assignee = document.getElementById("assignee").value;

    await fetch(`${API_BASE}/`, { 
        method: "POST", 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify({ 
            title: title, 
            description: description, 
            priority: priority, 
            status: "ToDo",
            assignee: assignee
        }) 
    });
    closeForm(); 
    render();
}

async function deleteTask(id) { 
    if (confirm("Are you sure you want to delete this task permanently?")) { 
        await fetch(`${API_BASE}/${id}`, { method: "DELETE" }); 
        render(); 
    } 
}

document.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
