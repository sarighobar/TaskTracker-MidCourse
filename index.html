<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f6f9; }
        .kanban-column { min-height: 650px; transition: background-color 0.2s ease; }
    </style>
</head>
<body class="text-gray-800 antialiased">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-white border-r border-gray-200 p-6 flex flex-col justify-between shrink-0">
            <div>
                <div class="flex items-center gap-2 mb-8">
                    <div class="p-2 bg-cyan-600 rounded-lg text-white font-bold text-sm">TT</div>
                    <span class="font-bold text-lg text-cyan-900 tracking-wider">TASK TRACKER</span>
                </div>
                <nav class="space-y-1">
                    <a href="#" class="flex items-center gap-3 bg-cyan-50 text-cyan-700 px-4 py-3 rounded-xl font-medium text-sm transition-all">
                        📋 Kanban Board
                    </a>
                </nav>
            </div>
            <div class="text-xs text-gray-400 font-medium">v2.1.0 Enterprise Core</div>
        </aside>

        <main class="flex-1 p-6 lg:p-8 min-w-0">
            <header class="mb-8">
                <div class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Engineering / Product Development</div>
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Sprint Workspace</h1>
            </header>

            <div id="statusMessage" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm"></div>

            <section class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm mb-8">
                <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-7 gap-3 items-center">
                    <input type="text" id="searchFilter" oninput="fetchDashboard()" placeholder="Filter tasks..." class="w-full bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500">
                    
                    <select id="priorityFilter" onchange="fetchDashboard()" class="w-full bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/20">
                        <option value="">All Priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>

                    <select id="overdueFilter" onchange="fetchDashboard()" class="w-full bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/20">
                        <option value="false">All Deadlines</option>
                        <option value="true">Overdue Only</option>
                    </select>

                    <input type="text" id="taskTitle" placeholder="Task summary*" class="w-full bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl text-sm font-medium border-cyan-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-cyan-500/20 focus:border-cyan-500">
                    <input type="text" id="taskDesc" placeholder="Description..." class="w-full bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/20">
                    <input type="text" id="taskTags" placeholder="Tags" class="w-full bg-gray-50 border border-gray-200 px-4 py-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500/20">
                    
                    <div class="flex gap-2 w-full lg:col-span-1">
                        <select id="taskPriority" class="w-1/2 bg-gray-50 border border-gray-200 px-2 py-2.5 rounded-xl text-xs focus:outline-none">
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Low">Low</option>
                        </select>
                        <input type="date" id="taskDueDate" class="w-1/2 bg-gray-50 border border-gray-200 px-2 py-2.5 rounded-xl text-[11px] text-gray-500 focus:outline-none">
                    </div>
                </div>
                <div class="mt-4 flex justify-end">
                    <button id="createTaskButton" onclick="createTrackerTask()" class="bg-cyan-700 hover:bg-cyan-800 text-white font-semibold text-sm px-6 py-2.5 rounded-xl transition-all shadow-sm shadow-cyan-700/10 disabled:opacity-60 disabled:cursor-not-allowed">
                        Create Task
                    </button>
                </div>
            </section>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
                
                <div class="bg-gray-100/70 border border-gray-200/60 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <span class="font-bold text-xs uppercase tracking-widest text-gray-500">To Do</span>
                        <span id="count-todo" class="bg-gray-200 text-gray-600 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="col-todo" class="kanban-column space-y-3"></div>
                </div>

                <div class="bg-gray-100/70 border border-gray-200/60 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <span class="font-bold text-xs uppercase tracking-widest text-gray-500">In Progress</span>
                        <span id="count-progress" class="bg-gray-200 text-gray-600 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="col-progress" class="kanban-column space-y-3"></div>
                </div>

                <div class="bg-gray-100/70 border border-gray-200/60 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <span class="font-bold text-xs uppercase tracking-widest text-gray-500">Done</span>
                        <span id="count-done" class="bg-gray-200 text-gray-600 text-xs font-bold px-2.5 py-0.5 rounded-full">0</span>
                    </div>
                    <div id="col-done" class="kanban-column space-y-3"></div>
                </div>

            </div>

            <section class="mt-8 rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h2 class="text-lg font-semibold text-gray-900">Activity Log</h2>
                        <p class="text-sm text-gray-500">Recent task actions and status changes.</p>
                    </div>
                </div>
                <div id="activityLogStream" class="space-y-3 text-sm text-gray-600">
                    <div class="rounded-xl border border-gray-200 bg-gray-50 p-3">No activity yet.</div>
                </div>
            </section>
        </main>

    </div>

    <script>
        let isSubmitting = false;

        const API = 'http://127.0.0.1:8000/tasks';

        function getApiUrl(path = "") {
            return 'http://127.0.0.1:8000/tasks';
        }

        function getTaskUrl(taskId) {
            return `http://127.0.0.1:8000/tasks/${taskId}`;
        }

        function showStatus(message, type = 'success') {
            const banner = document.getElementById('statusMessage');
            const baseClasses = 'border px-4 py-3 rounded-xl text-sm';
            if (type === 'error') {
                banner.className = `${baseClasses} border-red-200 bg-red-50 text-red-700`;
            } else {
                banner.className = `${baseClasses} border-cyan-200 bg-cyan-50 text-cyan-700`;
            }
            banner.innerText = message;
            banner.classList.remove('hidden');
        }

        function hideStatus() {
            const banner = document.getElementById('statusMessage');
            banner.classList.add('hidden');
            banner.innerText = '';
        }

        function setSubmitState(submitting) {
            const button = document.getElementById('createTaskButton');
            isSubmitting = submitting;
            button.disabled = submitting;
            button.innerText = submitting ? 'Creating...' : 'Create Task';
        }

        function renderEmptyState() {
            const emptyMessage = '<div class="rounded-xl border border-dashed border-gray-200 bg-gray-50 p-3 text-center text-xs text-gray-500">No tasks in this lane yet.</div>';
            document.getElementById('col-todo').insertAdjacentHTML('beforeend', emptyMessage);
            document.getElementById('col-progress').insertAdjacentHTML('beforeend', emptyMessage);
            document.getElementById('col-done').insertAdjacentHTML('beforeend', emptyMessage);
        }

        async function fetchDashboard() {
            try {
                const search = document.getElementById('searchFilter').value;
                const priority = document.getElementById('priorityFilter').value;
                const overdue = document.getElementById('overdueFilter').value;

                let queryUrl = `${API}?overdue_only=${overdue}`;
                if (search) queryUrl += `&search=${encodeURIComponent(search)}`;
                if (priority) queryUrl += `&priority_filter=${encodeURIComponent(priority)}`;

                const res = await fetch(queryUrl, { cache: 'no-store' });
                const tasks = await res.json();

                document.getElementById('col-todo').innerHTML = '';
                document.getElementById('col-progress').innerHTML = '';
                document.getElementById('col-done').innerHTML = '';

                let counts = { todo: 0, progress: 0, done: 0 };

                tasks.forEach(task => {
                    const card = createCardNode(task);
                    const normalizedStatus = task.status.replace(/\s+/g, '').toLowerCase();

                    if (normalizedStatus === 'todo') {
                        document.getElementById('col-todo').appendChild(card);
                        counts.todo++;
                    } else if (normalizedStatus === 'inprogress' || normalizedStatus === 'progress') {
                        document.getElementById('col-progress').appendChild(card);
                        counts.progress++;
                    } else {
                        document.getElementById('col-done').appendChild(card);
                        counts.done++;
                    }
                });

                document.getElementById('count-todo').innerText = counts.todo;
                document.getElementById('count-progress').innerText = counts.progress;
                document.getElementById('count-done').innerText = counts.done;

                if (tasks.length === 0) {
                    renderEmptyState();
                }

            } catch (err) {
                console.error("Dashboard synchronization error:", err);
            }
        }

        function createCardNode(task) {
            const div = document.createElement('div');
            div.className = "bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition-all space-y-3 relative group";
            
            let tagsHtml = '';
            if (task.tags) {
                tagsHtml = `<div class="flex flex-wrap gap-1 mt-1">` + 
                    task.tags.split(',').map(t => `<span class="bg-purple-50 text-purple-600 font-semibold text-[10px] px-2 py-0.5 rounded-md uppercase tracking-wider">${t.trim()}</span>`).join('') + 
                    `</div>`;
            }

            const dueDateHtml = task.due_date ? 
                `<div class="flex items-center gap-1 text-gray-400 text-xs font-medium">
                    <span>⏱️</span> <span>${task.due_date}</span>
                 </div>` : '';

            let pColor = "bg-gray-50 text-gray-600";
            if (task.priority === 'High') pColor = "bg-red-50 text-red-600";
            if (task.priority === 'Medium') pColor = "bg-cyan-50 text-cyan-600";

            const normalizedStatus = task.status.replace(/\s+/g, '').toLowerCase();

            let controlButtons = '';
            if (normalizedStatus === 'todo') {
                controlButtons = `<button onclick="updateStage(${task.id}, 'In Progress', 'To Do')" class="text-xs bg-gray-50 hover:bg-cyan-50 border border-gray-200 hover:border-cyan-200 text-gray-600 hover:text-cyan-700 font-semibold px-2.5 py-1 rounded-lg transition-all ml-auto flex items-center gap-1">Next ➡️</button>`;
            } else if (normalizedStatus === 'inprogress' || normalizedStatus === 'progress') {
                controlButtons = `
                    <div class="flex justify-between w-full gap-2">
                        <button onclick="updateStage(${task.id}, 'To Do', 'In Progress')" class="text-xs bg-gray-50 hover:bg-gray-100 border border-gray-200 text-gray-400 font-medium px-2 py-1 rounded-lg transition-all">⬅️ To Do</button>
                        <button onclick="updateStage(${task.id}, 'Done', 'In Progress')" class="text-xs bg-cyan-600 hover:bg-cyan-700 text-white font-semibold px-3 py-1 rounded-lg transition-all shadow-sm">Complete Check 🏆</button>
                    </div>`;
            } else if (normalizedStatus === 'done') {
                controlButtons = `<button onclick="updateStage(${task.id}, 'In Progress', 'Done')" class="text-xs bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 font-semibold px-2.5 py-1 rounded-lg transition-all mr-auto">↩️ Re-open Task</button>`;
            }

            div.innerHTML = `
                <button onclick="purgeTaskNode(${task.id})" class="absolute top-3 right-3 text-gray-300 hover:text-red-500 text-sm transition-all focus:outline-none opacity-0 group-hover:opacity-100">🗑️</button>
                <div class="space-y-1">
                    <h4 class="font-bold text-sm text-gray-900 leading-snug pr-4">${task.title || task.summary}</h4>
                    <p class="text-xs text-gray-500 leading-relaxed">${task.description || ''}</p>
                    ${tagsHtml}
                </div>
                <div class="flex items-center justify-between pt-1 border-t border-gray-50 mt-2">
                    ${dueDateHtml}
                    <span class="${pColor} font-bold text-[10px] px-2 py-0.5 rounded-md uppercase tracking-wider">${task.priority}</span>
                </div>
                <div class="pt-2 flex justify-end w-full">${controlButtons}</div>
            `;
            return div;
        }

        async function createTrackerTask() {
            if (isSubmitting) return;

            const titleValue = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDesc').value.trim();
            const tags = document.getElementById('taskTags').value.trim();
            const priority = document.getElementById('taskPriority').value;
            const due_date = document.getElementById('taskDueDate').value;

            if (!titleValue) {
                alert("⚠️ Please fill in the mandatory 'Task summary' field before creating a task!");
                return;
            }

            const taskPayload = {
                title: titleValue,
                summary: titleValue,
                description: description,
                tags: tags,
                priority: priority,
                status: "To Do",
                due_date: due_date || null
            };

            setSubmitState(true);
            hideStatus();

            try {
                const res = await fetch(getApiUrl(''), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(taskPayload)
                });

                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(errorText || "API responded with an execution failure state.");
                }

                document.getElementById('taskTitle').value = '';
                document.getElementById('taskDesc').value = '';
                document.getElementById('taskTags').value = '';
                document.getElementById('taskDueDate').value = '';
                
                showStatus('Task created successfully.');
                fetchDashboard();
            } catch (err) {
                console.error("Task injection failure:", err);
                showStatus(`Could not save task. ${err.message}`, 'error');
            } finally {
                setSubmitState(false);
            }
        }

        async function updateStage(id, nextStatus, currentStatus) {
            if (currentStatus === 'In Progress' && nextStatus === 'To Do') {
                alert("🚫 Operational Rule Violation: You cannot move tasks back to 'To Do' once they are 'In Progress'!");
                return;
            }

            try {
                const res = await fetch(getTaskUrl(id), {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ status: nextStatus })
                });
                if (!res.ok) throw new Error("Status transformation rejection.");
                showStatus(`Task moved to ${nextStatus}.`);
                fetchDashboard();
            } catch (err) {
                console.error("Task lifecycle adjustment trace crash:", err);
            }
        }

        async function purgeTaskNode(id) {
            if (!confirm("Are you sure you want to permanently delete this task record?")) return;
            try {
                const res = await fetch(getTaskUrl(id), { method: 'DELETE' });
                if (!res.ok) throw new Error("Purge endpoint validation error occurred.");
                showStatus('Task deleted.');
                fetchDashboard();
            } catch (err) {
                console.error("Task purge execution failure trace:", err);
            }
        }

        window.onload = fetchDashboard;
    </script>
</body>
</html>
